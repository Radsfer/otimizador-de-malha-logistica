[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
package-mode = false

[project]
name = "otimizador-malha-logistica"
version = "2.0.0"
description = "Otimizador de malha logística com MIP — tipagem, validação e testes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
kaggle = [
    "kaggle>=1.6",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otimizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
